# Embedding / LLM providers. Default is LOCAL so query/embedding/extraction run without
# external network (air-gap assumption). Switching to an external API requires an explicit opt-in.
# Concrete model names are intentionally unset: decided via ADR in Phase 2 / Phase 4.
allow_external: false
embedding:
  provider: local            # local | api
  endpoint: http://localhost:11434   # local runtime (e.g. Ollama on WSL2/Windows, GPU: RTX 4070)
  model: null
llm:
  provider: local
  endpoint: http://localhost:11434
  model: null
  temperature: 0.0
