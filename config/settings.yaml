# Non-secret runtime settings. Secrets live in .env.
http:
  min_interval_seconds:        # per-host minimum gap between requests
    default: 1.0
    pypi.org: 1.0
    api.github.com: 1.0
    api.osv.dev: 1.0
  timeout_seconds: 30
  max_retries: 4
  respect_robots_txt: true
  cache_dir: data/http_cache
  cache_ttl_seconds: 3600
